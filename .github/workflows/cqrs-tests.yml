name: CQRS Pipeline Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cqrs-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/Platform.Foundation.Application.Tests/Platform.Foundation.Application.Tests.csproj
      - name: Run pipeline tests
        run: dotnet test tests/Platform.Foundation.Application.Tests/Platform.Foundation.Application.Tests.csproj --no-restore --configuration Release
      - name: Restore Web exception tests
        run: dotnet restore tests/Platform.Foundation.Web.Tests/Platform.Foundation.Web.Tests.csproj
      - name: Run HTTP exception tests
        run: dotnet test tests/Platform.Foundation.Web.Tests/Platform.Foundation.Web.Tests.csproj --no-restore --configuration Release
      - name: Restore full solution
        run: dotnet restore shinera-back.slnx
      - name: Build full solution (compatibility)
        run: dotnet build shinera-back.slnx --no-restore --configuration Release
