name: Foundation Backend Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore CQRS tests
        run: dotnet restore tests/Platform.Foundation.Application.Tests/Platform.Foundation.Application.Tests.csproj
      - name: Run CQRS tests
        run: dotnet test tests/Platform.Foundation.Application.Tests/Platform.Foundation.Application.Tests.csproj --no-restore -c Release
      - name: Restore HTTP tests
        run: dotnet restore tests/Platform.Foundation.Web.Tests/Platform.Foundation.Web.Tests.csproj
      - name: Run HTTP tests
        run: dotnet test tests/Platform.Foundation.Web.Tests/Platform.Foundation.Web.Tests.csproj --no-restore -c Release
      - name: Restore Messaging tests
        run: dotnet restore tests/Platform.Foundation.Messaging.Tests/Platform.Foundation.Messaging.Tests.csproj
      - name: Run Messaging tests
        run: dotnet test tests/Platform.Foundation.Messaging.Tests/Platform.Foundation.Messaging.Tests.csproj --no-restore -c Release
      - name: Restore Observability tests
        run: dotnet restore tests/Platform.Foundation.Observability.Tests/Platform.Foundation.Observability.Tests.csproj
      - name: Run Observability tests
        run: dotnet test tests/Platform.Foundation.Observability.Tests/Platform.Foundation.Observability.Tests.csproj --no-restore -c Release
      - name: Restore full solution
        run: dotnet restore shinera-back.slnx
      - name: Build full solution
        run: dotnet build shinera-back.slnx --no-restore -c Release
